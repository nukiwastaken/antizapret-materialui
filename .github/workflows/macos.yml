name: macOS checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sh -n electron/zapret-runner.sh
      - run: npm test
      - run: npm run build
